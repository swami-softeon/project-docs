<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SFIX Documents – Index</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #1e2d3d;
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .page-wrap { width: 100%; max-width: 640px; }

    .site-header {
      background: linear-gradient(135deg, #0d3b6e 0%, #1565c0 60%, #1e88e5 100%);
      color: #fff;
      padding: 32px 40px;
      border-radius: 10px 10px 0 0;
    }
    .header-brand {
      font-size: 13px;
      opacity: .75;
      letter-spacing: .8px;
      text-transform: uppercase;
    }
    .header-title {
      margin-top: 10px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.3px;
    }
    .header-subtitle {
      margin-top: 6px;
      font-size: 14px;
      opacity: .85;
    }

    .card {
      background: #fff;
      border: 1px solid #dde3ec;
      border-top: none;
      border-radius: 0 0 10px 10px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(13,59,110,.06);
    }

    .doc-list { list-style: none; }
    .doc-link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: background .15s ease;
    }
    .doc-link:hover { background: #e8f0fc; }

    .doc-icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #e3f2fd;
      color: #1565c0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
    }
    .doc-info { flex: 1; min-width: 0; }
    .doc-name {
      font-size: 15px;
      font-weight: 600;
      color: #0d3b6e;
    }
    .doc-desc {
      margin-top: 2px;
      font-size: 13px;
      color: #5c6b7a;
    }
    .doc-arrow {
      flex-shrink: 0;
      color: #1565c0;
      font-size: 18px;
    }

    .doc-footer {
      text-align: center;
      font-size: 12px;
      color: #8899aa;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="page-wrap">
    <div class="site-header">
      <div class="header-brand">Softeon WMS — Solution Documents</div>
      <div class="header-title">SFIX Documents</div>
      <div class="header-subtitle">Index of available documents</div>
    </div>

    <div class="card">
      <ul class="doc-list">
        <li>
          <a class="doc-link" href="refix.html">
            <span class="doc-icon">R</span>
            <span class="doc-info">
              <span class="doc-name">REFIX Process – Solution Document</span>
              <span class="doc-desc">Packing Audit &amp; Order Correction Workflow</span>
            </span>
            <span class="doc-arrow">&rarr;</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="doc-footer">
      <p>Softeon WMS &nbsp;·&nbsp; SFIX &nbsp;·&nbsp; Customer A</p>
    </div>
  </div>

</body>
</html>
